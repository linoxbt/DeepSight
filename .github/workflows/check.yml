name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: deepsight-ci
          POSTGRES_DB: deepsight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.lock
      - run: pytest -q
      - run: node --test api/tests/chain_execution.test.mjs
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://postgres:deepsight-ci@127.0.0.1:5432/deepsight
      - run: python -c 'from api.db import init_db; init_db()'
        env:
          DATABASE_URL: postgresql+psycopg://postgres:deepsight-ci@127.0.0.1:5432/deepsight
          DEEPSIGHT_REQUIRE_MIGRATIONS: '1'
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
